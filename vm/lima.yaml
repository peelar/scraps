# Local worker-VM implementation. Lima is the first VM driver, not part of the
# Scraps architecture contract; other hypervisors (including Proxmox) can host
# the same Linux/OpenShell/scrapd stack later.
minimumLimaVersion: 2.0.0

# Inherit only the Ubuntu image. Lima's stock Docker template also inherits a
# host-home mount, which is intentionally forbidden for the worker boundary.
base:
  - template:_images/ubuntu-lts

cpus: 4
memory: 8GiB
disk: 60GiB
mounts: []

ssh:
  forwardAgent: false
  loadDotSSHPubKeys: false

containerd:
  system: false
  user: false

# Docker is rootful inside the protective worker VM. The socket is never
# forwarded or mounted into workspaces; the VM is the outer trust boundary.
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      if ! command -v docker >/dev/null 2>&1; then
        export DEBIAN_FRONTEND=noninteractive
        curl -fsSL https://get.docker.com | sh
      fi
      usermod -aG docker "{{.User}}"
      mkdir -p /etc/systemd/system/docker.socket.d
      cat >/etc/systemd/system/docker.socket.d/scraps.conf <<'EOF'
      [Socket]
      SocketMode=0666
      EOF
      systemctl daemon-reload
      systemctl enable --now docker.socket docker.service

probes:
  - mode: readiness
    description: Docker to be ready
    script: |
      #!/bin/bash
      set -eux -o pipefail
      timeout 60s bash -c 'until docker info >/dev/null 2>&1; do sleep 3; done'
    hint: See /var/log/cloud-init-output.log in the guest.

hostResolver:
  hosts:
    host.docker.internal: host.lima.internal

# scrapd remains guest-loopback-only. Lima exposes it only on host loopback so
# local Pi can keep using the stable http://127.0.0.1:8484 endpoint.
portForwards:
  - guestIP: 127.0.0.1
    guestPort: 8484
    hostIP: 127.0.0.1
    hostPort: 8484
  # Override Lima's fallback that otherwise forwards every guest-loopback
  # listener (including the OpenShell gateway) onto the developer host.
  - guestIP: 127.0.0.1
    guestPortRange: [1, 65535]
    ignore: true

message: |
  Scraps worker VM is ready. Use `make vm-shell` for diagnostics.
