# Local worker-VM implementation. Lima is the first VM driver, not part of the
# Scraps architecture contract; other hypervisors (including Proxmox) can host
# the same Linux/OpenShell/scrapd stack later.
minimumLimaVersion: 2.0.0

# Inherit only the Ubuntu image. Lima's stock Docker template also inherits a
# host-home mount, which is intentionally forbidden for the worker boundary.
base:
  - template:_images/ubuntu-lts

cpus: 4
memory: 8GiB
disk: 60GiB
mounts: []

ssh:
  forwardAgent: false
  loadDotSSHPubKeys: false

containerd:
  system: false
  user: false

# Install rootless Docker without exposing either the host socket to the guest
# or the guest socket to the host.
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      command -v docker >/dev/null 2>&1 && exit 0
      export DEBIAN_FRONTEND=noninteractive
      curl -fsSL https://get.docker.com | sh
      systemctl disable --now docker.service docker.socket containerd.service containerd.socket || true
      systemctl mask docker.service docker.socket containerd.service containerd.socket || true
      apt-get install -y uidmap dbus-user-session
  - mode: user
    script: |
      #!/bin/bash
      set -eux -o pipefail
      systemctl --user start dbus
      dockerd-rootless-setuptool.sh install
      docker context use rootless

probes:
  - mode: readiness
    description: rootless Docker to be ready
    script: |
      #!/bin/bash
      set -eux -o pipefail
      timeout 60s bash -c 'until docker info >/dev/null 2>&1; do sleep 3; done'
    hint: See /var/log/cloud-init-output.log in the guest.

hostResolver:
  hosts:
    host.docker.internal: host.lima.internal

# scrapd remains guest-loopback-only. Lima exposes it only on host loopback so
# local Pi can keep using the stable http://127.0.0.1:8484 endpoint.
portForwards:
  - guestIP: 127.0.0.1
    guestPort: 8484
    hostIP: 127.0.0.1
    hostPort: 8484

message: |
  Scraps worker VM is ready. Use `make vm-shell` for diagnostics.
