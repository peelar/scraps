id: github-push
display_name: GitHub (push)
description: GitHub reads plus Git smart-HTTP fetch and push
category: source_control
credentials:
- name: api_token
  description: Fine-grained GitHub personal access token
  env_vars:
  - GITHUB_TOKEN
  - GH_TOKEN
  required: true
  auth_style: bearer
  header_name: authorization
endpoints:
- host: api.github.com
  port: 443
  protocol: rest
  access: read-only
  enforcement: enforce
- host: api.github.com
  port: 443
  protocol: graphql
  access: read-only
  enforcement: enforce
  path: /graphql
- host: github.com
  port: 443
  protocol: rest
  enforcement: enforce
  rules:
  - allow:
      method: GET
      path: '**'
  - allow:
      method: HEAD
      path: '**'
  - allow:
      method: OPTIONS
      path: '**'
  - allow:
      method: POST
      path: /**/git-upload-pack
  - allow:
      method: POST
      path: /**/git-receive-pack
binaries:
- /usr/bin/gh
- /usr/local/bin/gh
- /usr/bin/git
- /usr/local/bin/git
inference_capable: false
discovery:
  credentials:
  - api_token
